name: moto_mobile
description: "moto-platform phone companion app (BLE telemetry client, ride history, settings)."
publish_to: 'none'
version: 0.2.0+3 # semver (D-036); +N = Android versionCode, bump on every release

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.31.0
  permission_handler: ^11.3.1
  http: ^1.2.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^7.2.2
  wakelock_plus: ^1.2.8
  archive: ^3.6.1
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^10.3.4
  moto_defs:
    path: external/moto-vehicle-defs/gen/dart/moto_defs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
