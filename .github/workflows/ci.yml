name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - run: flutter pub get

      # moto-connectivity-node is public (D-033): the single-source schema is read
      # without a token. A failed fetch fails the job instead of skipping the check.
      - name: Fetch BLE schema source (moto-connectivity-node)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ble_schema.json" \
            https://raw.githubusercontent.com/moto-platform/moto-connectivity-node/main/docs/ble_telemetry_packet_schema.json
          echo "MOTO_CONN_SCHEMA=$RUNNER_TEMP/ble_schema.json" >> "$GITHUB_ENV"
          echo "MOTO_SCHEMA_DRIFT_REQUIRED=1" >> "$GITHUB_ENV"

      - run: flutter analyze

      - run: flutter test

  build-apk:
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - run: flutter pub get

      # Release build signed with the default debug key (android/app/build.gradle.kts
      # already points the release signingConfig at signingConfigs.debug). Good enough
      # for workshop/field testing; a real release key is a separate concern.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: moto-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
