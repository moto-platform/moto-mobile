name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      # moto_defs (BLE packet layout, D-061) is a path dependency generated
      # from the external/moto-vehicle-defs submodule.
      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      # Last, so analyze and test still report on a commit pin before the tag.
      - name: Defs pin must be a release tag
        run: |
          git -C external/moto-vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/moto-vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/moto-vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

  build-apk:
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - run: flutter pub get

      # Release build signed with the default debug key (android/app/build.gradle.kts
      # already points the release signingConfig at signingConfigs.debug). Good enough
      # for workshop/field testing; a real release key is a separate concern.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: moto-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
